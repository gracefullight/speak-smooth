name: SpeakSmooth
options:
  bundleIdPrefix: com.speaksmooth
  deploymentTarget:
    macOS: "15.4"
  xcodeVersion: "26.0"
  minimumXcodeGenVersion: "2.40.0"
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.4"
    PRODUCT_BUNDLE_IDENTIFIER: com.speaksmooth.app
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
    ENABLE_HARDENED_RUNTIME: true
    CODE_SIGN_ENTITLEMENTS: SpeakSmooth/Resources/SpeakSmooth.entitlements

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    from: "0.10.0"
  RealTimeCutVADLibrary:
    url: https://github.com/helloooideeeeea/RealTimeCutVADLibrary.git
    from: "1.0.14"

targets:
  SpeakSmooth:
    type: application
    platform: macOS
    sources:
      - path: SpeakSmooth
        excludes:
          - Resources/Info.plist
    info:
      path: SpeakSmooth/Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        NSMicrophoneUsageDescription: SpeakSmooth needs microphone access to transcribe your voice.
        NSSpeechRecognitionUsageDescription: SpeakSmooth uses speech recognition to convert your voice to text.
        NSRemindersFullAccessUsageDescription: SpeakSmooth needs full Reminders access to save rewritten text into your selected list.
        NSRemindersUsageDescription: SpeakSmooth needs Reminders access to save rewritten text into your selected list.
    entitlements:
      path: SpeakSmooth/Resources/SpeakSmooth.entitlements
      properties:
        com.apple.security.device.audio-input: true
    dependencies:
      - package: WhisperKit
      - package: RealTimeCutVADLibrary
    settings:
      base:
        INFOPLIST_KEY_LSUIElement: true
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

  SpeakSmoothTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SpeakSmoothTests
    dependencies:
      - target: SpeakSmooth
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SpeakSmooth.app/Contents/MacOS/SpeakSmooth"
